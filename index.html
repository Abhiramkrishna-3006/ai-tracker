<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30-day AI automation tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#eef3fb;--grid:#d9e3f4;--card:#fff;--text:#10224a;--muted:#55648a;--line:#c6d3ec;--ac:#1f4fd8;--ok:#0f9d6b;--hot:#ff7a1a;--hl:#e3ebff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1530;--grid:#14234a;--card:#101d3d;--text:#e8efff;--muted:#93a4cf;--line:#24386b;--ac:#5cd6ff;--ok:#3ddc9a;--hot:#ffb23e;--hl:#172b5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1530;--grid:#14234a;--card:#101d3d;--text:#e8efff;--muted:#93a4cf;--line:#24386b;--ac:#5cd6ff;--ok:#3ddc9a;--hot:#ffb23e;--hl:#172b5a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:22px 16px 60px}
h1,h2,.big{font-family:"Space Grotesk",system-ui,sans-serif}
h1{font-size:1.9rem;line-height:1.1;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:1.15rem;margin:0}
.sub,.muted{color:var(--muted)}.sub{margin:0 0 16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:14px;margin-bottom:16px;box-shadow:5px 5px 0 var(--line)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:128px;height:128px;flex:none}.ring circle{fill:none;stroke-width:10}.ring .tr{stroke:var(--line)}
.ring .pg{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset .7s}
.ring text{font:700 26px "Space Grotesk",system-ui,sans-serif;fill:var(--text)}
.kp{display:flex;gap:10px;flex-wrap:wrap;flex:1}.kp div{flex:1;min-width:92px;border-left:4px solid var(--hot);padding:2px 10px}.kp b{display:block;font:700 1.5rem "Space Grotesk",system-ui,sans-serif}.kp span{font-size:.8rem;color:var(--muted)}
.status{font-size:.82rem;color:var(--muted);width:100%}
#todayCard{border-left:6px solid var(--hot)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0 14px}
.cal b{font-size:.75rem;text-align:center;color:var(--muted);font-weight:500}
.cal a,.cal span{aspect-ratio:1;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;text-decoration:none;color:var(--muted)}
.cal a{color:var(--text);border:1.5px solid var(--line);background:var(--card)}
.cal a small{font-size:.65rem;color:var(--muted)}
.cal a.p1{background:var(--hl);border-color:var(--ac)}.cal a.p2{background:var(--ok);color:#fff;border-color:var(--ok)}.cal a.p2 small{color:#fff}
.cal .t{outline:2px solid var(--hot);outline-offset:2px}
#mods{position:relative;padding-left:32px}
#mods:before{content:"";position:absolute;left:12px;top:10px;bottom:10px;border-left:3px dashed var(--line)}
.mod{position:relative}
.mod:before{content:"";position:absolute;left:-30px;top:16px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--line);transition:.4s}
.mod.on:before{border-color:var(--ac)}.mod.full:before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 5px var(--hl)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
details{border-top:1.5px dashed var(--line);padding:8px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;min-height:38px;align-items:center}
summary .pc{font-weight:700;min-width:44px;text-align:right;font-family:"Space Grotesk",system-ui,sans-serif}
details.dn summary span:first-child:before{content:"\2713  ";color:var(--ok);font-weight:700}
details.today{background:var(--hl);border-radius:4px;padding:8px;border-top:0}
.chk{display:flex;gap:10px;align-items:center;padding:5px 0;min-height:38px}.chk input{width:20px;height:20px;accent-color:var(--ac);flex:none}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.lbl{font-size:.85rem;color:var(--muted);margin-top:6px}
textarea,input[type=number],input[type=time]{border:1.5px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);padding:8px;font:inherit}
textarea{width:100%;min-height:54px;resize:vertical;margin-top:6px}input[type=number]{width:80px}
a.btn,button{display:inline-block;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;cursor:pointer;text-decoration:none;margin:6px 6px 0 0}
a.btn.pri{background:var(--hot);color:#1b1000;border-color:var(--hot);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:var(--ok);color:#04150e;padding:10px 18px;border-radius:999px;font-weight:600;transition:.35s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<h1>AI automation blueprint</h1>
<p class="sub">26 Nov – 25 Dec 2026 · 2 hours a day · IST</p>
<div class="card hero"><svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Overall progress"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" id="oRing" cx="60" cy="60" r="52"/><text id="oPct" x="60" y="69" text-anchor="middle">0%</text></svg>
<div class="kp"><div><b id="oPlan">0%</b><span>planned by today</span></div><div><b id="oStreak">0</b><span>day streak</span></div><div><b id="oDay">–</b><span>of 30 days</span></div></div>
<div class="status" id="status">Loading…</div></div>
<div class="card" id="todayCard"></div>
<div class="card">
<h2>Calendar</h2>
<p class="muted" style="margin:2px 0 0">Daily study time <input type="time" id="tm" value="19:00" aria-label="Daily study start time"></p>
<a class="btn pri" id="allCal" target="_blank" rel="noopener">Add all 30 days to Google Calendar</a>
<p class="muted" style="font-size:.85rem;margin:4px 0 0">Adds one repeating 2-hour event. For Apple or Outlook calendars, import the .ics file I shared in the chat.</p>
<div id="cals"></div>
</div>
<div id="mods"></div>
</main><div class="toast" id="toast" role="status"></div>
<script>
var M=[
{n:"Module 1: Foundations",d:[
["Telegram bot: first reply",["API, webhook, JSON in one sentence each","Trigger vs action"],["Create a bot with BotFather","Trigger + Send message workflow","Activate it and test without clicking"],"n8n beginner tutorial"],
["Google Sheets as a database",["Rows, columns and sheet IDs"],["Connect your Google account","Append each bot message as a row"],"n8n google sheets tutorial"],
["Two-step conversations",["Why bots need to remember the last step"],["Ask for name, then service","Save both in one row"],"telegram bot conversation n8n"],
["JSON and expressions",["Nested JSON and dot paths","What an expression is"],["Pull 3 fields with expressions","Build a formatted reply"],"n8n expressions json tutorial"],
["Debugging and errors",["Reading the execution log","Error workflows"],["Break a node on purpose and read the error","Add an error alert to yourself"],"n8n error handling"],
["Project: booking logger",["Review your notes from days 1-5"],["Bot asks name and service, saves, confirms","Test it with 3 friends"],""],
["Week 1 review and test",["Re-read your notes"],["Fix your weakest day's workflow","Take the week 1 test with Claude"],""]]},
{n:"Module 2: Booking logic and reminders",d:[
["Dates and times",["Time zones and date formats"],["Parse a date from a message","Show it in IST"],"n8n date and time functions"],
["Scheduled triggers",["Cron basics"],["Run a workflow every morning at 8","Send yourself a summary"],"n8n schedule trigger"],
["Check a slot against the sheet",["Lookups and filters"],["Read booked slots from the sheet","Tell the user if a slot is free"],"n8n google sheets lookup"],
["Stop double bookings",["Conditions and IF nodes"],["Refuse a taken slot","Suggest the next free slot"],"n8n if node tutorial"],
["Send 24-hour reminders",["Looping over rows"],["Find tomorrow's bookings","Send each customer a reminder"],"n8n loop over items"],
["Project: salon booking flow",["Review days 8-12 notes"],["Full flow: book, check, confirm, remind","Test with 3 friends"],""],
["Week 2 review and test",["Re-read your notes"],["Fix your weakest workflow","Take the week 2 test with Claude"],""]]},
{n:"Module 3: WhatsApp",d:[
["Meta developer app setup",["Meta app, business account, test number"],["Create the app and add WhatsApp","Find your token and phone number ID"],"WhatsApp Cloud API setup tutorial"],
["Send a WhatsApp message",["Verified test recipients"],["Send a message from n8n or the Meta panel","Keep the token private"],"WhatsApp Cloud API n8n"],
["Receive messages with a webhook",["Webhook verification"],["Connect the webhook URL","Log an incoming message"],"WhatsApp webhook setup Meta"],
["Menu replies",["Parsing user choices"],["Build 1 Book, 2 Cancel, 3 Timings","Handle invalid input"],"WhatsApp chatbot menu n8n"],
["Templates and the 24-hour window",["Template vs free-form messages","What costs money"],["Create one reminder template","Send it to a test number"],"WhatsApp message templates explained"],
["Project: WhatsApp booking bot",["Review days 15-19 notes"],["Move your salon flow onto WhatsApp","Test with 3 friends"],""],
["Week 3 review and test",["Re-read your notes"],["Fix your weakest workflow","Take the week 3 test with Claude"],""]]},
{n:"Module 4: AI agents and demo",d:[
["Call an AI model from a workflow",["What a model call needs: prompt in, text out"],["Add a Gemini or other model node","Reply to a message with it"],"n8n Gemini API tutorial"],
["System prompts for FAQs",["Role, rules, tone, limits"],["Write an FAQ prompt for one business","Test 10 tricky questions"],"system prompt writing for chatbots"],
["Give the agent tools",["What an agent tool is"],["Tool 1: check free slots","Tool 2: create a booking"],"n8n AI agent tools tutorial"],
["Short-term memory",["Session IDs and memory windows"],["Add memory to the agent","Test a 5-message conversation"],"n8n AI agent memory"],
["Guardrails and human handoff",["What the agent must refuse"],["Hand off to a human when unsure","Log every conversation"],"AI agent guardrails basics"],
["Project: AI booking assistant",["Review days 22-26 notes"],["Connect agent, tools, memory, WhatsApp","Test with 5 friends"],""],
["Week 4 review and test",["Re-read your notes"],["Fix the weakest part","Take the week 4 test with Claude"],""],
["Record a demo video",["How to script a 2-minute demo"],["Record a 2-minute screen demo","Trim and save it"],"how to record a product demo"],
["One-page project summary",["Problem, solution, result format"],["Write a one-page summary","Save it with the demo"],""]]}
];

var KEY="ai-auto-30-v2",S={c:{},n:{},s:{},t:"19:00",u:0},DB=null,uid=null;
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
var start=new Date(2026,10,26),now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
var today=Math.floor((t0-start)/864e5)+1;
var MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var D=[];
M.forEach(function(m,mi){m.d.forEach(function(x){var n=D.length+1,ids=[],h="";
 x[1].forEach(function(s,i){ids.push(["d"+n+"l"+i,"Learn: "+s])});
 x[2].forEach(function(s,i){ids.push(["d"+n+"b"+i,"Build: "+s])});
 ids.push(["d"+n+"n","Notes: what broke and how you fixed it"]);
 D.push({n:n,m:mi,t:x[0],q:x[3],items:ids,test:/test/.test(x[0])})})});
function dt(n){return new Date(2026,10,26+n-1)}
function fmt(d){return d.getDate()+" "+MN[d.getMonth()]}
function pct(items){var k=0;items.forEach(function(i){if(S.c[i[0]])k++});return items.length?Math.round(k/items.length*100):0}
function dpct(n){return pct(D[n-1].items)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function p2(n){return n<10?"0"+n:""+n}
function gcal(n){var d=dt(n),s=S.t||"19:00",h=+s.slice(0,2),m=s.slice(3,5),e=p2((h+2)%24)+m;
 var ds=d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate());
 return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("AI automation: "+D[n-1].t)+"&dates="+ds+"T"+p2(h)+m+"00/"+ds+"T"+e+"00&ctz=Asia/Kolkata&details="+encodeURIComponent("Day "+n+" of 30. Tick your checklist in the tracker.")}
function allcal(){var s=S.t||"19:00",h=+s.slice(0,2),m=s.slice(3,5);
 return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("AI automation study (2 hours)")+"&dates=20261126T"+p2(h)+m+"00/20261126T"+p2((h+2)%24)+m+"00&ctz=Asia/Kolkata&recur="+encodeURIComponent("RRULE:FREQ=DAILY;COUNT=30")}
function item(i){return '<label class="chk"><input type="checkbox" data-i="'+i[0]+'"><span>'+esc(i[1])+'</span></label>'}
function topic(x,open){
 var yt=x.q?'<a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(x.q)+'">YouTube: '+esc(x.q)+'</a>':"";
 return '<details'+(open?' open':'')+' data-n="'+x.n+'" id="day'+x.n+'"><summary><span>Day '+x.n+' · '+fmt(dt(x.n))+' · '+esc(x.t)+'</span><span class="pc" data-p="'+x.n+'"></span></summary>'+
 x.items.map(item).join("")+
 '<textarea data-note="'+x.n+'" placeholder="Your notes for day '+x.n+'" aria-label="Notes for day '+x.n+'"></textarea>'+
 (x.test?'<div class="lbl">Test score <input type="number" min="0" max="10" data-sc="'+x.n+'" aria-label="Test score out of 10"> / 10</div>':"")+
 '<div>'+yt+'<a class="btn" target="_blank" rel="noopener" data-g="'+x.n+'">Add to Google Calendar</a></div></details>'}
var mh="";
M.forEach(function(m,mi){mh+='<div class="card mod" data-m="'+mi+'"><div class="row"><h2>'+esc(m.n)+'</h2><b data-mp="'+mi+'"></b></div><div class="bar"><i data-mb="'+mi+'"></i></div><div style="margin-top:8px">'+D.filter(function(x){return x.m==mi}).map(function(x){return topic(x,false)}).join("")+'</div></div>'});
document.getElementById("mods").innerHTML=mh;
function calHtml(y,mo){var f=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate(),h='<h2 style="margin-top:10px;font-size:1rem">'+MN[mo]+" "+y+'</h2><div class="cal">';
 ["S","M","T","W","T","F","S"].forEach(function(w){h+="<b>"+w+"</b>"});
 for(var i=0;i<f.getDay();i++)h+="<span></span>";
 for(var d=1;d<=dim;d++){var n=Math.round((new Date(y,mo,d)-start)/864e5)+1;
  if(n>=1&&n<=30)h+='<a href="#day'+n+'" data-cd="'+n+'" data-top="'+n+'">'+d+'<small></small></a>';else h+="<span>"+d+"</span>"}
 return h+"</div>"}
document.getElementById("cals").innerHTML=calHtml(2026,10)+calHtml(2026,11);
document.querySelectorAll("[data-cd]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();var el=document.getElementById("day"+a.dataset.cd);el.open=true;el.scrollIntoView()})});
function bind(root){
 root.querySelectorAll("[data-i]").forEach(function(c){c.addEventListener("change",function(){var dn=parseInt(c.dataset.i.slice(1)),was=dpct(dn);if(c.checked)S.c[c.dataset.i]=1;else delete S.c[c.dataset.i];changed();if(was<100&&dpct(dn)==100)toast("Day "+dn+" complete")})});
 root.querySelectorAll("[data-note]").forEach(function(t){t.addEventListener("input",function(){S.n[t.dataset.note]=t.value;changed()})});
 root.querySelectorAll("[data-sc]").forEach(function(t){t.addEventListener("input",function(){if(t.value==="")delete S.s[t.dataset.sc];else S.s[t.dataset.sc]=Math.max(0,Math.min(10,+t.value));changed()})})}
function fill(){document.querySelectorAll("[data-i]").forEach(function(c){c.checked=!!S.c[c.dataset.i];c.parentNode.classList.toggle("done",c.checked)});
 document.querySelectorAll("[data-note]").forEach(function(t){if(document.activeElement!==t)t.value=S.n[t.dataset.note]||""});
 document.querySelectorAll("[data-sc]").forEach(function(t){if(document.activeElement!==t)t.value=S.s[t.dataset.sc]==null?"":S.s[t.dataset.sc]});
 document.getElementById("tm").value=S.t||"19:00"}
function paint(){
 var all=[],plan=[];D.forEach(function(x){all=all.concat(x.items);if(x.n<=today)plan=plan.concat(x.items)});
 document.getElementById("oPct").textContent=pct(all)+"%";
 document.getElementById("oRing").style.strokeDashoffset=327-327*pct(all)/100;var tt=Math.min(30,today);if(tt>=1&&dpct(tt)<100)tt--;var sk=0;while(tt>=1&&dpct(tt)==100){sk++;tt--}document.getElementById("oStreak").textContent=sk;document.getElementById("oDay").textContent=today<1?"0":Math.min(today,30);document.querySelectorAll("details[data-n]").forEach(function(d){d.classList.toggle("dn",dpct(+d.dataset.n)==100)});
 document.getElementById("oPlan").textContent=(today<1?0:pct0(plan))+"%";
 M.forEach(function(m,mi){var it=[];D.forEach(function(x){if(x.m==mi)it=it.concat(x.items)});var p=pct(it);
  document.querySelector('[data-mp="'+mi+'"]').textContent=p+"%";document.querySelector('[data-mb="'+mi+'"]').style.width=p+"%";var me=document.querySelector('.mod[data-m="'+mi+'"]');me.classList.toggle("on",p>0);me.classList.toggle("full",p==100)});
 D.forEach(function(x){var p=dpct(x.n);document.querySelectorAll('[data-p="'+x.n+'"]').forEach(function(e){e.textContent=p+"%"});
  document.querySelectorAll('[data-cd="'+x.n+'"]').forEach(function(a){a.className=p==100?"p2":p>0?"p1":"";if(x.n==today)a.classList.add("t");a.querySelector("small").textContent=p+"%"})});
 document.querySelectorAll("[data-g]").forEach(function(a){a.href=gcal(+a.dataset.g)});
 document.getElementById("allCal").href=allcal();
 document.querySelectorAll(".chk").forEach(function(l){l.classList.toggle("done",l.firstChild.checked)})}
function pct0(it){return it.length?Math.round(it.filter(function(i){return !!S.c[i[0]]}).length/it.length*100):0}
function renderToday(){var el=document.getElementById("todayCard");
 if(today<1){el.innerHTML="<h2>Starts 26 Nov</h2><p class='muted'>Your plan begins on day 1.</p>";return}
 if(today>30){el.innerHTML="<h2>Plan window finished</h2><p class='muted'>Review any unchecked items below.</p>";return}
 var x=D[today-1];el.innerHTML="<h2>Today: day "+today+"</h2>"+topic(x,true).replace('id="day'+x.n+'"','').replace("<details",'<details class="today"');
 bind(el)}
var timer=null,tt0=null;function toast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt0);tt0=setTimeout(function(){e.classList.remove("show")},2200)}
function changed(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}paint();syncOthers();
 if(DB){clearTimeout(timer);timer=setTimeout(function(){setStatus("Saving…");DB.set(JSON.parse(JSON.stringify(S))).then(function(){setStatus("Saved to your account · works on any device you sign in on")},function(){setStatus("Could not save to your account. Saved on this device only.")})},700)}}
function syncOthers(){fill()}
function setStatus(t){document.getElementById("status").textContent=t}
document.getElementById("tm").addEventListener("change",function(){S.t=this.value||"19:00";changed()});
bind(document.getElementById("mods"));renderToday();fill();paint();
setStatus("Saved on this device. Connecting to your account…");
(async function(){
 try{
  var user=await claude.use("user"),db=await claude.use("db");
  if(!user||!db){setStatus("Saved on this device only. Open the link while signed in to sync across devices.");return}
  uid=await user.id();if(!uid){setStatus("Saved on this device only.");return}
  DB=db.collection("data/users/"+uid).doc("tracker");
  var snap=await DB.get();
  if(snap.exists){var d=snap.data();if((d.u||0)>(S.u||0)){S=Object.assign({c:{},n:{},s:{},t:"19:00",u:0},d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}fill();paint()}}
  else if(S.u){await DB.set(JSON.parse(JSON.stringify(S)))}
  setStatus("Synced to your account · works on any device you sign in on")
 }catch(e){DB=null;setStatus("Saved on this device only (account sync unavailable).")}
})();
</script>
</body>
</html>
